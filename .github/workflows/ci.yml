name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (Xcode ${{ matrix.xcode }})
    # No secrets: runs the offline tests and an ad hoc signed universal build.
    # ui_test.sh and ui_snapshots.sh stay local; they need a logged-in GUI
    # session and Screen Recording permission.
    #
    # Xcode is pinned, so CI compiles with the same Swift as the Mac that
    # cuts releases (27.0) and with the previous major release (26.6), which
    # contributors may still use. Xcode 27 runners are a GitHub preview image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "27.0"
            runner: xcode-27
          - xcode: "26.6"
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          xcrun swiftc --version
      - name: Offline tests
        run: sh test.sh
      - name: Universal build
        run: EVENTKIT_ARCHS="arm64 x86_64" sh build.sh
      - name: Check the bundle
        run: |
          sh scripts/check_bundle.sh build/EventKitBridge.app arm64 x86_64
          build/bridge-client --help > /dev/null
