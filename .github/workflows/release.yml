name: Release

# Pushing a v* tag builds the release in the protected "release" environment
# (a required reviewer approves the run) and leaves a draft GitHub release
# with the notarized DMG and zip, SHA256SUMS and, once a Sparkle key is
# set, appcast.xml. The maintainer reviews the draft and publishes it.
#
# release.sh does the work, the same script that runs by hand. The workflow
# only provides the secrets: the Developer ID certificate in a temporary
# keychain, the notary API key and the Sparkle key as files that are deleted
# at the end. Secrets of the "release" environment (docs/MAINTAINING.md):
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD   the certificate (base64) and its password
#   NOTARY_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID    the App Store Connect API key (base64 .p8), key ID, issuer
#   SPARKLE_PRIVATE_KEY                            optional: the EdDSA key from generate_keys -x

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release and its assets
  id-token: write # build attestations
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and draft the release
    runs-on: xcode-27
    environment: release
    # Two notarizations of up to 45 minutes each (release.sh), plus tests and build.
    timeout-minutes: 120
    env:
      # The same Xcode as CI's first matrix entry and the maintainer's Mac.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check_version.sh compares with the previous v* tag
          fetch-tags: true
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          xcrun swiftc --version
          xcrun notarytool --version

      - name: Import the signing certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          [ -n "$DEVELOPER_ID_P12" ] && [ -n "$DEVELOPER_ID_P12_PASSWORD" ] \
            || { echo "The DEVELOPER_ID_P12 and DEVELOPER_ID_P12_PASSWORD secrets are needed" >&2; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV" # so the last step deletes it even after a failure below
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | tr -d '"' | head -n 1)
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "EVENTKIT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notary and Sparkle keys
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          [ -n "$NOTARY_KEY" ] || { echo "The NOTARY_KEY secret is needed" >&2; exit 1; }
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "EVENTKIT_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
            echo "EVENTKIT_SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
          else
            echo "No SPARKLE_PRIVATE_KEY secret: no appcast.xml in this release"
          fi

      - name: Tests, universal build, notarization, DMG, zip and draft release
        env:
          EVENTKIT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          EVENTKIT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$EVENTKIT_NOTARY_KEY_ID" ] || { echo "The NOTARY_KEY_ID secret is needed" >&2; exit 1; }
          sh release.sh

      - name: Attest the downloads
        # Build attestations need a public repository (or GitHub Enterprise).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Remove the keychain and keys
        if: ${{ always() }}
        run: |
          [ -z "${RELEASE_KEYCHAIN:-}" ] || security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/certificate.p12"
