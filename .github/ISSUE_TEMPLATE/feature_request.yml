name: Feature request
description: Suggest something new or different.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This is a personal project with best-effort support. Some things aren't possible through Apple's EventKit (inviting people, answering invitations, attachments, travel time, the Reminders app's tags and subtasks); see the support matrix in docs/API.md.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Events
        - Reminders
        - Access and clients
        - MCP and AI agents
        - Remote Access and cloud agents
        - Command line
        - App and menu bar
        - Other
